pcd2pgm:
  ros__parameters:
    # Live mode: subscribe to GLIM's accumulated map instead of loading a file once.
    # Leave pcd_file unset - it's ignored whenever live_topic is non-empty.
    live_topic: "/glim_ros/map"

    # Grid origin (metres, map frame) and physical size. Size this to the WHOLE
    # competition arena with real margin, not to whatever gets manually explored -
    # Nav2's static layer only avoids a full resize/reinit if width/height/resolution
    # stay identical on every update, and these three params are what fix them.
    fixed_origin_x: -25.0
    fixed_origin_y: -25.0
    fixed_width_m: 50.0
    fixed_height_m: 50.0

    map_resolution: 0.05
    map_topic_name: "map"

    # Same filters as file mode, re-run on every received cloud.
    flag_pass_through: false
    # Heights are in GLIM's map frame, whose z=0 is the LiDAR's START height,
    # not the ground. Keep 0.2-1.8 m above GROUND: min = 0.2 - lidar_z,
    # max = 1.8 - lidar_z. Placeholder lidar_z = 0.60. Must match the
    # min/max_obstacle_height values in kratos_nav/config/nav2_params.yaml.
    thre_z_min: -0.40
    thre_z_max: 1.20
    # thre_radius/thres_point_count reject a point unless it has this many
    # neighbors within this radius. GLIM voxel-downsamples each submap at
    # submap_voxel_resolution=0.5 m (config_sub_mapping_cpu.json), so points on
    # a flat wall sit on a ~0.5 m grid with AT MOST 4 neighbors within 0.5 m
    # (axis-aligned only - diagonal neighbors are ~0.71 m away). The old
    # 0.5/5 combo was tuned for a dense file-mode PCD scan and is IMPOSSIBLE to
    # pass here: every point on every wall gets removed and /map is always
    # empty. Verified: at 0.5 m/5 nothing survives a simulated wall; at
    # 0.75 m/2 every wall point survives incl. edges, while a truly isolated
    # single stray point (0-1 neighbors) still gets dropped.
    thre_radius: 0.75
    thres_point_count: 2
