# Nav2 params for Kratos on a LIVE GLIM map (ROS 2 Humble).
#
# Who publishes what (nothing here may duplicate it):
#   GLIM            TF map -> odom -> base_link   (replaces AMCL + wheel odom)
#   nav.launch.py   TF base_link -> livox_frame   (static, LiDAR mount)
#   pcd2pgm live    /map  OccupancyGrid           (replaces map_server)
#   driver          /livox/lidar  PointCloud2     (live obstacles)
#
# HEIGHT NUMBERS: GLIM's odom/map origin is where the LiDAR started, NOT the
# ground. We put base_link ON THE GROUND directly under the LiDAR, so
# lidar_z (nav.launch.py) = measured LiDAR height above ground, and the
# ground sits at z = -lidar_z in map/odom. Placeholder lidar_z = 0.60, so
# "0.2 m to 1.8 m above ground" becomes min -0.40 / max 1.20 below.
# Measure the real rover: min = 0.2 - lidar_z, max = 1.8 - lidar_z.
# pcd2pgm_live.yaml thre_z_min/thre_z_max MUST use the same two numbers.

bt_navigator:
  ros__parameters:
    use_sim_time: false
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /glim_ros/odom
    bt_loop_duration: 10
    default_server_timeout: 20
    # nav.launch.py replaces these two with absolute paths to our no-spin trees.
    # The keys MUST exist here: RewrittenYaml only replaces keys it finds, and
    # a missing key silently falls back to the stock trees (which need Spin).
    default_nav_to_pose_bt_xml: "set_by_nav_launch"
    default_nav_through_poses_bt_xml: "set_by_nav_launch"
    plugin_lib_names:
      - nav2_compute_path_to_pose_action_bt_node
      - nav2_compute_path_through_poses_action_bt_node
      - nav2_smooth_path_action_bt_node
      - nav2_follow_path_action_bt_node
      - nav2_spin_action_bt_node
      - nav2_wait_action_bt_node
      - nav2_assisted_teleop_action_bt_node
      - nav2_back_up_action_bt_node
      - nav2_drive_on_heading_bt_node
      - nav2_clear_costmap_service_bt_node
      - nav2_is_stuck_condition_bt_node
      - nav2_goal_reached_condition_bt_node
      - nav2_goal_updated_condition_bt_node
      - nav2_globally_updated_goal_condition_bt_node
      - nav2_is_path_valid_condition_bt_node
      - nav2_initial_pose_received_condition_bt_node
      - nav2_reinitialize_global_localization_service_bt_node
      - nav2_rate_controller_bt_node
      - nav2_distance_controller_bt_node
      - nav2_speed_controller_bt_node
      - nav2_truncate_path_action_bt_node
      - nav2_truncate_path_local_action_bt_node
      - nav2_goal_updater_node_bt_node
      - nav2_recovery_node_bt_node
      - nav2_pipeline_sequence_bt_node
      - nav2_round_robin_node_bt_node
      - nav2_transform_available_condition_bt_node
      - nav2_time_expired_condition_bt_node
      - nav2_path_expiring_timer_condition
      - nav2_distance_traveled_condition_bt_node
      - nav2_single_trigger_bt_node
      - nav2_goal_updated_controller_bt_node
      - nav2_is_battery_low_condition_bt_node
      - nav2_navigate_through_poses_action_bt_node
      - nav2_navigate_to_pose_action_bt_node
      - nav2_remove_passed_goals_action_bt_node
      - nav2_planner_selector_bt_node
      - nav2_controller_selector_bt_node
      - nav2_goal_checker_selector_bt_node
      - nav2_controller_cancel_bt_node
      - nav2_path_longer_on_approach_bt_node
      - nav2_wait_cancel_bt_node
      - nav2_spin_cancel_bt_node
      - nav2_back_up_cancel_bt_node
      - nav2_assisted_teleop_cancel_bt_node
      - nav2_drive_on_heading_cancel_bt_node
      - nav2_is_battery_charging_condition_bt_node

bt_navigator_navigate_through_poses_rclcpp_node:
  ros__parameters:
    use_sim_time: false

bt_navigator_navigate_to_pose_rclcpp_node:
  ros__parameters:
    use_sim_time: false

# ---------------------------------------------------------------------------
# Controller: follows the path, outputs cmd_vel (linear.x + angular.z only).
# Regulated Pure Pursuit: works for car-like AND differential drive, and with
# use_rotate_to_heading false it never asks for a spin in place.
# ---------------------------------------------------------------------------
controller_server:
  ros__parameters:
    use_sim_time: false
    controller_frequency: 10.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    odom_topic: /glim_ros/odom
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.5
      movement_time_allowance: 15.0

    general_goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      stateful: true
      xy_goal_tolerance: 0.5
      # Ignore final heading: reaching a yaw would need turning in place.
      yaw_goal_tolerance: 6.28

    FollowPath:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      desired_linear_vel: 0.4          # m/s, keep slow while GLIM is being trusted
      lookahead_dist: 0.8
      min_lookahead_dist: 0.5
      max_lookahead_dist: 1.5
      lookahead_time: 1.5
      use_velocity_scaled_lookahead_dist: true
      rotate_to_heading_angular_vel: 0.8
      transform_tolerance: 0.3
      min_approach_linear_velocity: 0.05
      approach_velocity_scaling_dist: 0.8
      use_collision_detection: true
      max_allowed_time_to_collision_up_to_carrot: 1.5
      use_regulated_linear_velocity_scaling: true
      use_cost_regulated_linear_velocity_scaling: false
      regulated_linear_scaling_min_radius: 0.9
      regulated_linear_scaling_min_speed: 0.15
      use_rotate_to_heading: false     # NO spinning in place
      allow_reversing: false
      rotate_to_heading_min_angle: 0.785
      max_angular_accel: 2.0
      max_robot_pose_search_dist: 10.0
      use_interpolation: true

# ---------------------------------------------------------------------------
# Local costmap: small window that follows the rover, LIVE LiDAR only.
# ---------------------------------------------------------------------------
local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: false
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_link
      rolling_window: true
      width: 6
      height: 6
      resolution: 0.05
      transform_tolerance: 0.3
      # PLACEHOLDER footprint from the URDF (wheels at x +-0.2 (+0.12 radius),
      # y +-0.3). Measure the real rover, outermost points, plus ~5 cm.
      footprint: "[[0.37, 0.37], [0.37, -0.37], [-0.37, -0.37], [-0.37, 0.37]]"
      footprint_padding: 0.03
      plugins: ["obstacle_layer", "inflation_layer"]

      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: lidar
        lidar:
          # Raw driver cloud, not /livox/lidar_filtered: the angle filter cuts a
          # 30 deg cone straight AHEAD, which would make the rover blind to what
          # it drives into. Self-hits on the rover body are dropped by
          # obstacle_min_range instead. If a permanent blob sticks to the rover
          # in RViz, raise obstacle_min_range.
          topic: /livox/lidar
          data_type: "PointCloud2"
          marking: true
          clearing: true
          min_obstacle_height: -0.40   # ground + 0.2 m (see HEIGHT NUMBERS)
          max_obstacle_height: 1.20    # ground + 1.8 m
          obstacle_min_range: 0.5
          obstacle_max_range: 5.0
          raytrace_min_range: 0.0
          raytrace_max_range: 6.0
          expected_update_rate: 0.0

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        inflation_radius: 0.6
        cost_scaling_factor: 3.0

      always_send_full_costmap: true

# ---------------------------------------------------------------------------
# Global costmap: whole arena. static_layer = pcd2pgm's live /map.
# obstacle_layer on top so things the 10 s map hasn't caught yet still show.
# ---------------------------------------------------------------------------
global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: false
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_link
      resolution: 0.05                 # must equal pcd2pgm map_resolution
      track_unknown_space: true
      transform_tolerance: 0.3
      footprint: "[[0.37, 0.37], [0.37, -0.37], [-0.37, -0.37], [-0.37, 0.37]]"
      footprint_padding: 0.03
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]

      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_topic: /map
        # pcd2pgm publishes /map reliable + transient_local; must match or
        # the subscription silently never connects.
        map_subscribe_transient_local: true
        subscribe_to_updates: false

      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: lidar
        lidar:
          topic: /livox/lidar
          data_type: "PointCloud2"
          marking: true
          clearing: true
          min_obstacle_height: -0.40
          max_obstacle_height: 1.20
          obstacle_min_range: 0.5
          obstacle_max_range: 5.0
          raytrace_min_range: 0.0
          raytrace_max_range: 6.0
          expected_update_rate: 0.0

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        inflation_radius: 0.6
        cost_scaling_factor: 3.0

      always_send_full_costmap: true

# ---------------------------------------------------------------------------
# Planner: Hybrid A* knows the rover has a minimum turning radius, so it only
# produces paths the double-ackermann steering can physically drive.
# ---------------------------------------------------------------------------
planner_server:
  ros__parameters:
    use_sim_time: false
    expected_planner_frequency: 1.0
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_smac_planner/SmacPlannerHybrid"
      downsample_costmap: false
      downsampling_factor: 1
      tolerance: 0.5
      # Most of the arena is unknown until you've driven it; allow planning
      # through unknown or every far waypoint fails.
      allow_unknown: true
      max_iterations: 1000000
      max_on_approach_iterations: 1000
      max_planning_time: 3.0
      motion_model_for_search: "DUBIN"   # forward only (no reversing)
      angle_quantization_bins: 72
      analytic_expansion_ratio: 3.5
      analytic_expansion_max_length: 3.0
      # Steering limit +-90 deg with track 0.6 m means R must stay > 0.3 m.
      # 0.6 gives margin. Real rover: set to its true tightest turn.
      minimum_turning_radius: 0.6
      reverse_penalty: 2.0
      change_penalty: 0.0
      non_straight_penalty: 1.2
      cost_penalty: 2.0
      retrospective_penalty: 0.015
      lookup_table_size: 20.0
      cache_obstacle_heuristic: false
      smooth_path: true
      smoother:
        max_iterations: 1000
        w_smooth: 0.3
        w_data: 0.2
        tolerance: 1.0e-10
        do_refinement: true
        refinement_num: 2

smoother_server:
  ros__parameters:
    use_sim_time: false
    smoother_plugins: ["simple_smoother"]
    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: true

behavior_server:
  ros__parameters:
    use_sim_time: false
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["backup", "wait"]   # no spin, no drive_on_heading
    backup:
      plugin: "nav2_behaviors/BackUp"
    wait:
      plugin: "nav2_behaviors/Wait"
    global_frame: odom
    robot_base_frame: base_link
    transform_tolerance: 0.3
    simulate_ahead_time: 2.0
    max_rotational_vel: 0.5
    min_rotational_vel: 0.2
    rotational_acc_lim: 1.0

waypoint_follower:
  ros__parameters:
    use_sim_time: false
    loop_rate: 20
    stop_on_failure: false
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: true
      waypoint_pause_duration: 2000

# Final stage before the wheels: caps speed/accel, outputs /cmd_vel.
velocity_smoother:
  ros__parameters:
    use_sim_time: false
    smoothing_frequency: 20.0
    scale_velocities: false
    feedback: "OPEN_LOOP"
    max_velocity: [0.5, 0.0, 1.0]
    min_velocity: [-0.3, 0.0, -1.0]
    max_accel: [1.0, 0.0, 2.0]
    max_decel: [-1.0, 0.0, -2.0]
    odom_topic: /glim_ros/odom
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 1.0
