# ZED 2i as a depth sensor only, on top of zed-ros2-wrapper v5.4.1's common_stereo.yaml + zed2i.yaml.
# GLIM owns the pose (TF map -> odom -> base_link) and nav.launch.py publishes the static
# base_link -> zed_camera_link, so the ZED must not track or publish TF: a second
# odom -> ... publisher would give zed_camera_link two parents.
# depth.depth_mode is set by perception.launch.py: NONE with depth:=ess (ESS computes depth from
# the gray pair, so the SDK's own depth network would only cost GPU), NEURAL with depth:=zed.
/**:
  ros__parameters:
    general:
      grab_resolution: 'HD720'    # 1280x720
      grab_frame_rate: 30
      pub_resolution: 'NATIVE'
      pub_frame_rate: 15.0        # the rover drives <= 0.5 m/s: 15 Hz depth is plenty for nvblox,
                                  # and halves ESS's GPU load vs 30 Hz
    video:
      publish_rgb: true
      publish_gray: true          # left/right gray rect pair for ESS
      publish_left_right: true
    depth:
      min_depth: 0.3
      max_depth: 10.0
      openni_depth_mode: false    # 32FC1 metres (depth:=zed)
      point_cloud_freq: 1.0
    pos_tracking:
      pos_tracking_enabled: false
      publish_tf: false
      publish_map_tf: false
    mapping:
      mapping_enabled: false
    object_detection:
      od_enabled: false
